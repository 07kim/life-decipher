<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Decipher</title>
  <meta name="description" content="不確実性創発型ステルスアセスメント・シミュレーター — Life Decipher Ver 2.1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ブート画面 -->
  <div id="boot-screen">
    <div id="boot-inner">
      <div id="boot-logo-text">LIFE<span id="boot-logo-accent"> DECIPHER</span></div>
      <div id="boot-version">Ver. 2.1 — Behavioral Analysis System</div>
      <div id="boot-bar-wrap"><div id="boot-bar-inner"></div></div>
      <div id="boot-status">システムを起動しています…</div>
    </div>
  </div>

  <!-- ========================
       デスクトップ本体
       ======================== -->
  <div id="desktop">

    <!-- グリッチ用 Canvas オーバーレイ -->
    <canvas id="noise-overlay"></canvas>

    <!-- デスクトップアイコン -->
    <div id="desktop-icons"></div>

    <!-- 付箋エリア -->
    <div id="sticky-area"></div>

    <!-- スタートメニュー -->
    <div id="start-menu" class="hidden">
      <div class="sm-header">Project LD OS</div>
      <div class="sm-items">
        <div class="sm-item" data-action="settings"><span>⚙️</span> 設定</div>
        <div class="sm-item" data-action="terminal"><span>🖥️</span> ターミナル</div>
        <div class="sm-sep"></div>
        <div class="sm-item" data-action="shutdown"><span>⏻</span> シャットダウン</div>
      </div>
    </div>

    <!-- ウィンドウコンテナ -->
    <div id="win-container"></div>

    <!-- タイプライターオーバーレイ -->
    <div id="typewriter-overlay" class="hidden">
      <div id="typewriter-win">
        <div id="typewriter-text"></div>
      </div>
    </div>

  </div>

  <!-- ========================
       タスクバー
       ======================== -->
  <div id="taskbar">
    <button id="start-btn">⊞ スタート</button>
    <div id="taskbar-items"></div>
    <div id="taskbar-right">
      <div id="taskbar-notif"></div>
      <div id="clock">00:00</div>
    </div>
  </div>

  <!-- ========================
       フィードバック画面
       ======================== -->
  <div id="feedback-screen" class="hidden"></div>

  <!-- コンテキストメニュー -->
  <div id="ctx-menu" class="hidden"></div>

  <!-- ========================
       スクリプト読み込み（順序依存）
       ======================== -->
  <!-- 1. コンテンツデータ -->
  <script src="content/diary.js"></script>
  <script src="content/notes.js"></script>
  <script src="content/files.js"></script>

  <!-- 2. エンジン層 -->
  <script src="logger.js"></script>
  <script src="assessment.js"></script>
  <script src="audio.js"></script>
  <script src="effects.js"></script>
  <script src="feedback.js"></script>

  <!-- 3. メインアプリ（最後） -->
  <script src="app.js"></script>

</body>
</html>
